<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduIG-Pipeline Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <h1>EduIG-Pipeline</h1>
            <p>Academic Instagram Data Extraction Dashboard</p>
        </header>

        <div class="dashboard-grid">
            <!-- Target Manager Section -->
            <section class="glass-panel targets-section">
                <h2>Target Manager</h2>
                
                <form id="add-target-form" class="input-group">
                    <input type="text" id="target-username" placeholder="Enter username (e.g., rana_hamza16)" required autocomplete="off">
                    <button type="submit" class="btn btn-primary">
                        <span>Add Target</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                </form>

                <div class="targets-list-header">
                    <span>Username</span>
                    <span>API Consent</span>
                    <span>Action</span>
                </div>
                <div id="targets-list" class="targets-list">
                    <!-- Targets injected here via JS -->
                    <div class="loading">Loading targets...</div>
                </div>
            </section>

            <!-- Execution Section -->
            <section class="glass-panel execution-section">
                <div class="execution-header">
                    <h2>Pipeline Execution</h2>
                    <button id="run-btn" class="btn btn-success">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        <span>Run Scraper</span>
                    </button>
                </div>
                
                <div class="terminal-container">
                    <div class="terminal-header">
                        <div class="mac-btns">
                            <span class="close"></span>
                            <span class="minimize"></span>
                            <span class="maximize"></span>
                        </div>
                        <span class="terminal-title">python run.py</span>
                    </div>
                    <div id="terminal-output" class="terminal-output">
                        Waiting for execution to start...
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
