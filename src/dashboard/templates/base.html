<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduIG-Pipeline | Dashboard</title>
    
    <!-- PWA Meta tags -->
    <meta name="theme-color" content="#3b82f6">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            500: '#3b82f6',
                            600: '#2563eb',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased flex h-screen overflow-hidden">

    <!-- Skip to main content -->
    <a href="#main-content" class="sr-only focus:not-sr-only bg-blue-600 text-white p-4 z-50 rounded-br-lg font-bold">Skip to main content</a>

    <!-- Offline Banner -->
    <div id="offline-banner" class="hidden w-full bg-yellow-600 text-yellow-50 py-2 px-4 text-sm text-center font-medium absolute top-0 z-50">
        <i class="fa-solid fa-wifi-slash mr-2"></i> You are currently offline. Viewing cached data.
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="bg-slate-800 text-white w-64 flex-shrink-0 flex flex-col transition-all duration-300 transform border-r border-slate-700 shadow-lg relative h-full">
        <div class="h-16 flex items-center px-6 border-b border-slate-700 bg-slate-800">
            <i class="fa-brands fa-instagram text-2xl text-pink-500 mr-3"></i>
            <span class="text-xl font-bold tracking-wider">EduIG Data</span>
        </div>
        
        <nav class="flex-1 px-4 py-6">
            <div class="space-y-1">
                <a href="/" class="flex items-center px-4 py-3 text-slate-300 hover:bg-slate-700 hover:text-white rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 {% if request.endpoint == 'index' %}bg-slate-700 text-white border-l-4 border-blue-500{% endif %}" aria-current="{% if request.endpoint == 'index' %}page{% else %}false{% endif %}">
                    <i class="fa-solid fa-chart-line w-6 text-center"></i>
                    <span class="ml-3 font-medium">Dashboard</span>
                </a>
                <a href="/profiles" class="flex items-center px-4 py-3 text-slate-300 hover:bg-slate-700 hover:text-white rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 {% if request.endpoint == 'profiles_page' %}bg-slate-700 text-white border-l-4 border-blue-500{% endif %}" aria-current="{% if request.endpoint == 'profiles_page' %}page{% else %}false{% endif %}">
                    <i class="fa-solid fa-users w-6 text-center"></i>
                    <span class="ml-3 font-medium">Profiles</span>
                </a>
                <a href="/compliance" class="flex items-center px-4 py-3 text-slate-300 hover:bg-slate-700 hover:text-white rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 {% if request.endpoint == 'compliance_page' %}bg-slate-700 text-white border-l-4 border-blue-500{% endif %}" aria-current="{% if request.endpoint == 'compliance_page' %}page{% else %}false{% endif %}">
                    <i class="fa-solid fa-shield-halved w-6 text-center"></i>
                    <span class="ml-3 font-medium">Compliance</span>
                </a>
                <a href="/settings" class="flex items-center px-4 py-3 text-slate-300 hover:bg-slate-700 hover:text-white rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 {% if request.endpoint == 'settings_page' %}bg-slate-700 text-white border-l-4 border-blue-500{% endif %}" aria-current="{% if request.endpoint == 'settings_page' %}page{% else %}false{% endif %}">
                    <i class="fa-solid fa-gear w-6 text-center"></i>
                    <span class="ml-3 font-medium">Settings</span>
                </a>
            </div>
        </nav>
        
        <div class="p-4 border-t border-slate-700 text-sm text-slate-400">
            <div class="flex items-center mb-2">
                <div class="w-2 h-2 rounded-full bg-green-500 mr-2" id="connection-status-indicator"></div>
                <span id="connection-status-text">Online</span>
            </div>
            <p>EduIG-Pipeline v1.0</p>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col w-full min-w-0 bg-slate-900">
        <!-- Header -->
        <header class="bg-slate-800 border-b border-slate-700 h-16 flex items-center justify-between px-4 sm:px-6 flex-shrink-0 z-10">
            <div class="flex items-center">
                <button id="sidebar-toggle" class="lg:hidden text-slate-300 hover:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 mr-4 p-2 rounded" aria-label="Toggle Navigation">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <h1 class="text-lg sm:text-xl font-semibold text-slate-100 truncate">{% block header_title %}Overview{% endblock %}</h1>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-sm text-slate-400 hidden sm:inline" id="last-sync-time">Syncing...</span>
                <button onclick="window.location.reload()" class="text-slate-400 hover:text-blue-500 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 p-2 rounded" title="Refresh Data">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </header>

        <!-- Main Scrollable Area -->
        <main id="main-content" class="flex-1 overflow-x-hidden overflow-y-auto p-4 sm:p-6 lg:p-8 custom-scrollbar relative focus:outline-none" tabindex="-1">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Scripts -->
    <script src="/static/js/pwa.js"></script>
    <script src="/static/js/charts.js"></script>
    <script src="/static/js/dashboard.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
