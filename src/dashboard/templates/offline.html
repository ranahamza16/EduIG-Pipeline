<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduIG-Pipeline | Offline</title>
    <meta name="theme-color" content="#3b82f6">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased flex h-screen items-center justify-center">

    <div class="max-w-md w-full bg-white rounded-xl shadow-sm border border-gray-200 p-8 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-yellow-100 text-yellow-600 mb-6">
            <i class="fa-solid fa-wifi-slash text-2xl"></i>
        </div>
        
        <h1 class="text-2xl font-bold text-gray-900 mb-2">You are offline</h1>
        <p class="text-gray-500 mb-8">It looks like you've lost your internet connection. Some data may be stale, and the requested page could not be found in the local cache.</p>
        
        <button onclick="window.location.reload()" class="w-full inline-flex justify-center items-center px-4 py-2 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
            <i class="fa-solid fa-rotate-right mr-2"></i>
            Retry Connection
        </button>
        
        <div class="mt-6">
            <a href="/" class="text-sm font-medium text-blue-600 hover:text-blue-500">Return to cached dashboard <span aria-hidden="true">&rarr;</span></a>
        </div>
    </div>

</body>
</html>
