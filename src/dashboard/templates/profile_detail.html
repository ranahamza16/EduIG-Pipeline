{% extends "base.html" %}

{% block header_title %}Profile Detail{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Back Navigation -->
    <div>
        <a href="/profiles" class="inline-flex items-center text-sm font-medium text-slate-400 hover:text-slate-100 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-lg p-1">
            <i class="fa-solid fa-arrow-left mr-2"></i> Back to Profiles
        </a>
    </div>

    <!-- Loading Skeleton -->
    <div id="profileLoading" class="bg-slate-800 rounded-xl shadow-sm border border-slate-700 p-8 text-center animate-pulse">
        <div class="inline-block w-24 h-24 rounded-full bg-slate-700 mb-4"></div>
        <div class="h-6 bg-slate-700 w-48 mx-auto rounded mb-2"></div>
        <div class="h-4 bg-slate-700 w-32 mx-auto rounded"></div>
    </div>

    <!-- Content (Hidden initially) -->
    <div id="profileContent" class="hidden space-y-6">
        
        <!-- Header Card -->
        <div class="bg-slate-800 rounded-xl shadow-sm border border-slate-700 p-6 hover-lift">
            <div class="flex flex-col sm:flex-row items-center sm:items-start text-center sm:text-left gap-6">
                <!-- Avatar -->
                <div id="avatarContainer" class="w-24 h-24 sm:w-32 sm:h-32 rounded-full overflow-hidden border-4 border-slate-700 bg-slate-900 flex-shrink-0 flex items-center justify-center">
                    <img id="detailAvatar" src="" alt="Profile picture" class="w-full h-full object-cover text-slate-500 hidden" onload="this.classList.remove('hidden')">
                </div>
                <!-- Info -->
                <div class="flex-1 w-full">
                    <div class="flex items-center justify-center sm:justify-start gap-2 mb-1">
                        <h2 class="text-2xl font-bold text-slate-100" id="detailUsername">@username</h2>
                        <i id="detailVerified" class="fa-solid fa-circle-check text-blue-500 hidden text-lg" title="Verified"></i>
                        <span id="detailPrivateBadge" class="hidden ml-2 px-2 py-0.5 text-xs font-semibold bg-slate-700 text-slate-300 rounded border border-slate-600"><i class="fa-solid fa-lock mr-1"></i>Private Account</span>
                    </div>
                    <p class="text-lg text-slate-300 font-medium mt-1 mb-3 leading-normal" id="detailFullName"></p>
                    <p class="text-slate-400 max-w-2xl text-sm leading-relaxed" id="detailBio"></p>
                    
                    <!-- Stats Bar -->
                    <div class="flex flex-wrap justify-center sm:justify-start gap-6 mt-6 pt-6 border-t border-slate-700">
                        <div>
                            <p class="text-2xl font-bold text-slate-100" id="detailPostsCount">-</p>
                            <p class="text-sm text-slate-400 uppercase tracking-wide">Posts</p>
                        </div>
                        <div>
                            <p class="text-2xl font-bold text-slate-100" id="detailFollowers">-</p>
                            <p class="text-sm text-slate-400 uppercase tracking-wide">Followers</p>
                        </div>
                        <div>
                            <p class="text-2xl font-bold text-slate-100" id="detailFollowing">-</p>
                            <p class="text-sm text-slate-400 uppercase tracking-wide">Following</p>
                        </div>
                        <div id="detailEngagementContainer">
                            <p class="text-2xl font-bold text-slate-100" id="detailEngagement">-</p>
                            <p class="text-sm text-slate-400 uppercase tracking-wide">Engagement</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Latest Posts Grid -->
        <div id="latestPostsSection" class="bg-slate-800 rounded-xl shadow-sm border border-slate-700 p-6 hover-lift hidden">
            <h3 class="text-lg font-semibold text-slate-100 mb-4 border-b border-slate-700 pb-2">Latest Posts Sample</h3>
            <div id="postsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                <!-- Injected via JS -->
            </div>
        </div>
        
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const pathParts = window.location.pathname.split('/');
        const profileId = pathParts[pathParts.length - 1];
        if (profileId && profileId !== 'profile') {
            Dashboard.loadProfileDetail(profileId);
        }
    });
</script>
{% endblock %}
